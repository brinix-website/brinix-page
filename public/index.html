<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ✅ Basic SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brinix | Creative Design & Development Studio</title>
    <meta
      name="description"
      content="Brinix is a creative agency specializing in UI/UX design, web development, branding, and digital marketing. We help brands build stunning digital experiences."
    />
    <meta
      name="keywords"
      content="Brinix, design agency, web development, UI/UX, digital marketing, branding, creative studio"
    />
    <meta name="author" content="Brinix Studio" />

    <!-- ✅ Open Graph (For social media sharing) -->
    <meta property="og:title" content="Brinix | Creative Design & Development Studio" />
    <meta
      property="og:description"
      content="Transform your brand with Brinix — experts in web design, development, and digital marketing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.vercel.app/" />
    <meta property="og:image" content="https://yourdomain.vercel.app/og-image.jpg" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brinix | Design & Development Studio" />
    <meta
      name="twitter:description"
      content="We create powerful digital experiences that grow your brand."
    />
    <meta name="twitter:image" content="https://yourdomain.vercel.app/og-image.jpg" />

    <!-- ✅ Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://yourdomain.vercel.app/" />

    <!-- ✅ Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Brinix",
        "url": "https://yourdomain.vercel.app",
        "logo": "https://yourdomain.vercel.app/logo.png",
        "sameAs": [
          "https://instagram.com/brinix",
          "https://linkedin.com/company/brinix"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
